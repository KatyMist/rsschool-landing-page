<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Каталог кофейни Resource Coffee House: кофе, чай и десерты." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Resource Coffee House — Каталог</title>
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a href="index.html" class="logo">
          <span class="logo__name">Resource</span>
          <span class="logo__tagline">Coffee House</span>
        </a>

        <nav class="nav" data-nav>
          <a href="index.html" class="nav__link">Главная</a>
          <a href="catalog.html" class="nav__link nav__link--active">Каталог</a>
        </nav>

        <div class="header__actions">
          <button
            class="theme-toggle"
            data-theme-toggle
            aria-pressed="false"
            aria-label="Переключить тему"
          >
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"></path>
            </svg>
          </button>
          <button
            class="burger"
            data-burger-toggle
            aria-expanded="false"
            aria-label="Открыть меню"
          >
            <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M3 6h18M3 12h18M3 18h18"></path>
            </svg>
            <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M5 5l14 14M19 5L5 19"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="section catalog">
        <div class="container">
          <h1 class="section__title">Каталог</h1>

          <div class="catalog__categories">
            <button class="catalog__category catalog__category--active">Кофе</button>
            <button class="catalog__category">Чай</button>
            <button class="catalog__category">Десерты</button>
          </div>

          <div class="catalog__grid">
            <article class="card">
              <img class="card__image" src="" alt="Латте" />
              <div class="card__body">
                <h3 class="card__title">Латте</h3>
                <p class="card__price">250 ₽</p>
              </div>
            </article>
            <!-- остальные карточки добавляются динамически или дублируются -->
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <div class="footer__logo logo">
          <span class="logo__name">Resource</span>
          <span class="logo__tagline">Coffee House</span>
        </div>
        <div class="footer__contacts">
          <p>ул. Примерная, 1</p>
          <p>+7 900 000-00-00</p>
        </div>
      </div>
      <p class="container footer__copyright">© 2026 Resource Coffee House. Учебный проект RS School.</p>
    </footer>

    <script type="module" src="/src/scripts/main.js"></script>
  </body>
</html>
